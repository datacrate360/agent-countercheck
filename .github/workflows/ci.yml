name: CI

on:
  push:
    branches: [DEV, TEST, PROD]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Eval tasks are valid
        run: cargo build --release && python3 eval/validate.py
      - name: Recipes give the expected verdicts
        run: sh recipes/oracle-to-snowflake/test/run-test.sh "$PWD/target/release/countercheck"

  linux:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --workspace
      - name: Examples give the expected verdicts
        run: sh examples/ml-eval-threshold/run-example.sh "$PWD/target/debug/countercheck"
      - name: pytest for the Python example
        run: python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install -q pytest && echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: The Python example gives the expected verdicts
        run: sh examples/python-pytest/run-example.sh "$PWD/target/debug/countercheck"
      - name: Recipes give the expected verdicts
        run: sh recipes/oracle-to-snowflake/test/run-test.sh "$PWD/target/debug/countercheck"
      - name: Install script syntax
        run: sh -n install.sh && sh -n packaging/homebrew/formula.sh
      # The Linux sandbox has two modes: Landlock only (where user namespaces are blocked, e.g.
      # Ubuntu's AppArmor default or Docker), and Landlock + namespaces (no internet, PID namespace).
      # The tests above ran in whichever mode the runner has; run the sandbox tests in both.
      - name: Linux sandbox, probe as the runner comes
        run: cargo build -q && target/debug/countercheck sandbox-exec --probe
      - name: Linux sandbox tests with user namespaces allowed
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          target/debug/countercheck sandbox-exec --probe
          cargo test -q -p countercheck --test verify -- linux_sandbox with_namespaces --nocapture
      - name: Linux sandbox tests with user namespaces blocked
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=0 || true
          sudo sysctl -w user.max_user_namespaces=0 || true
          target/debug/countercheck sandbox-exec --probe
          cargo test -q -p countercheck --test verify -- linux_sandbox with_namespaces --nocapture

  windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show; rustup component add clippy
      # Tests run from PowerShell with the runner's usual PATH; countercheck finds Git for Windows' sh.
      - name: Which sh
        run: where.exe sh; where.exe git; git --exec-path
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The Windows sandbox (write-restricted token + Job Object) must start on this runner: every
      # check in the tests below runs in it (`--sandbox auto`), and the probe says why if not.
      - name: Windows sandbox probe
        run: cargo build -q; target/debug/countercheck.exe sandbox-exec --probe
      - name: Test
        run: cargo test --workspace
      # The example's check runs `python3`; Windows' Python is `python`, so give sh a python3 if needed.
      - name: python3 for the example
        shell: bash
        run: |
          if ! python3 -c "print(1)" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/shim"
            printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/shim/python3"
            chmod +x "$RUNNER_TEMP/shim/python3"
            echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          fi
      - name: Examples give the expected verdicts
        shell: bash
        run: sh examples/ml-eval-threshold/run-example.sh "$PWD/target/debug/countercheck.exe"
      - name: Install script syntax
        run: pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null"
      # install.ps1 end to end against a zip of this build: installs when the checksum matches,
      # installs nothing when it doesn't.
      - name: Install script works
        run: |
          $out = New-Item -ItemType Directory "$env:RUNNER_TEMP/dl" -Force
          New-Item -ItemType Directory "$env:RUNNER_TEMP/stage" -Force | Out-Null
          Copy-Item target/debug/countercheck.exe, LICENSE, README.md "$env:RUNNER_TEMP/stage/"
          Compress-Archive -Path "$env:RUNNER_TEMP/stage/*" -DestinationPath "$out/countercheck-0.0.0-windows-x86_64.zip"
          $hash = (Get-FileHash "$out/countercheck-0.0.0-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  countercheck-0.0.0-windows-x86_64.zip" | Set-Content "$out/SHA256SUMS.txt"
          $server = Start-Process python -ArgumentList '-m','http.server','18765','--bind','127.0.0.1','--directory',"$out" -PassThru
          Start-Sleep -Seconds 2
          $env:COUNTERCHECK_VERSION = '0.0.0'
          $env:COUNTERCHECK_BASE_URL = 'http://127.0.0.1:18765'
          $env:COUNTERCHECK_INSTALL_DIR = "$env:RUNNER_TEMP/bin"
          ./install.ps1
          & "$env:RUNNER_TEMP/bin/countercheck.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'installed binary does not run' }
          ("0" * 64) + "  countercheck-0.0.0-windows-x86_64.zip" | Set-Content "$out/SHA256SUMS.txt"
          $env:COUNTERCHECK_INSTALL_DIR = "$env:RUNNER_TEMP/bin2"
          $failed = $false
          try { ./install.ps1 } catch { $failed = $_.Exception.Message -like '*checksum mismatch*' }
          Stop-Process -Id $server.Id
          if (-not $failed) { throw 'a bad checksum must stop the install' }
          if (Test-Path "$env:RUNNER_TEMP/bin2/countercheck.exe") { throw 'installed despite a bad checksum' }

  # Evidence for docs/decisions/0003-windows-sandbox.md: what an AppContainer allows on this
  # runner (internet, localhost between processes, Git's sh, Python), with and without the
  # admin-only loopback exemption. Informational; it never fails the build.
  appcontainer-evidence:
    name: AppContainer evidence (windows)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run the AppContainer probe
        continue-on-error: true
        run: |
          $env:PROBE_PYTHON = (Get-Command python).Source
          cargo run -q --manifest-path eval/windows-evidence/Cargo.toml
      # The runner is elevated; the same probe as a fresh standard (non-admin) user says whether
      # any of it needs admin rights.
      - name: Run the AppContainer probe as a standard user
        continue-on-error: true
        run: |
          New-Item -ItemType Directory C:\acprobe -Force | Out-Null
          Copy-Item eval/windows-evidence/target/debug/appcontainer-probe.exe C:\acprobe\
          icacls C:\acprobe /grant "*S-1-5-32-545:(OI)(CI)M" | Out-Null
          $pw = 'Cc-' + [guid]::NewGuid().ToString('N').Substring(0, 16) + '!a1'
          net user ccprobe $pw /add /y | Out-Null
          $cred = [pscredential]::new("$env:COMPUTERNAME\ccprobe", (ConvertTo-SecureString $pw -AsPlainText -Force))
          $env:PROBE_PYTHON = (Get-Command python).Source
          $env:PROBE_OUT = 'C:\acprobe'
          $p = Start-Process -FilePath C:\acprobe\appcontainer-probe.exe -Credential $cred -LoadUserProfile -WorkingDirectory C:\acprobe -RedirectStandardOutput C:\acprobe\out.txt -RedirectStandardError C:\acprobe\err.txt -Wait -PassThru
          "exit: $($p.ExitCode)"
          Get-Content C:\acprobe\out.txt, C:\acprobe\err.txt -ErrorAction SilentlyContinue

  dco:
    name: sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off (git commit -s, see CONTRIBUTING.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c" | cut -c1-80) has no Signed-off-by line; fix with: git rebase --signoff <base> && git push --force-with-lease"
              bad=1
            fi
          done
          exit $bad

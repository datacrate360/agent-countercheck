name: Release

# Push a tag `vX.Y.Z` (matching the version in Cargo.toml) to build and publish a release:
#   countercheck-X.Y.Z-macos-universal.tar.gz, -linux-x86_64, -linux-aarch64 (static musl builds),
#   countercheck-X.Y.Z-windows-x86_64.zip (static C runtime, see .cargo/config.toml),
#   Python wheels (pip / uv / uvx), the Homebrew formula, and SHA256SUMS.txt.
# Run it by hand (Actions → Release → Run workflow) to build everything without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read and check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"; exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --workspace --release
      - name: Universal binary
        run: |
          cargo build --release --locked -p countercheck --target aarch64-apple-darwin
          cargo build --release --locked -p countercheck --target x86_64-apple-darwin
          mkdir stage
          lipo -create -output stage/countercheck \
            target/aarch64-apple-darwin/release/countercheck target/x86_64-apple-darwin/release/countercheck
          cp LICENSE README.md stage/
          ./stage/countercheck --version
          tar -czf "countercheck-${{ needs.version.outputs.version }}-macos-universal.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with: { name: bin-macos, path: "*.tar.gz" }

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, platform: linux-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --workspace --release
      - name: Static binary
        run: |
          cargo build --release --locked -p countercheck --target ${{ matrix.target }}
          mkdir stage
          cp target/${{ matrix.target }}/release/countercheck LICENSE README.md stage/
          ./stage/countercheck --version
          tar -czf "countercheck-${{ needs.version.outputs.version }}-${{ matrix.platform }}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with: { name: "bin-${{ matrix.platform }}", path: "*.tar.gz" }

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo test --workspace --release
      - name: Binary
        shell: pwsh
        run: |
          cargo build --release --locked -p countercheck --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/countercheck.exe, LICENSE, README.md stage/
          ./stage/countercheck.exe --version
          Compress-Archive -Path stage/* -DestinationPath "countercheck-${{ needs.version.outputs.version }}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: bin-windows-x86_64, path: "*.zip" }

  install-windows:
    # install.ps1 against the zip just built (checksum, unzip, --version), before anything is published.
    needs: [version, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bin-windows-x86_64, path: out }
      - name: Install script works against these files
        shell: pwsh
        run: |
          Get-ChildItem out/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content out/SHA256SUMS.txt
          $server = Start-Process python -ArgumentList '-m','http.server','18765','--bind','127.0.0.1','--directory','out' -PassThru
          # Wait until the server answers (a fixed sleep raced it on slow runners).
          $up = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:18765/' | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw 'the local download server did not start' }
          $env:COUNTERCHECK_VERSION = '${{ needs.version.outputs.version }}'
          $env:COUNTERCHECK_BASE_URL = 'http://127.0.0.1:18765'
          $env:COUNTERCHECK_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./install.ps1
          & "$env:RUNNER_TEMP\bin\countercheck.exe" --version
          Stop-Process -Id $server.Id

  wheels:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: universal2-apple-darwin, manylinux: "off" }
          - { runner: ubuntu-latest, target: x86_64, manylinux: "2_17" }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_17" }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runner: windows-latest, target: x64, manylinux: "off" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: README links absolute for PyPI
        shell: bash
        run: for py in python3 python; do "$py" -c 1 >/dev/null 2>&1 && exec "$py" packaging/pypi_readme.py "$GITHUB_REF_NAME"; done; exit 1
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with: { name: "wheel-${{ matrix.target }}", path: dist/*.whl }

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README links absolute for PyPI
        shell: bash
        run: for py in python3 python; do "$py" -c 1 >/dev/null 2>&1 && exec "$py" packaging/pypi_readme.py "$GITHUB_REF_NAME"; done; exit 1
      - uses: PyO3/maturin-action@v1
        with: { command: sdist, args: --out dist }
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }

  release:
    needs: [version, macos, linux, windows, install-windows, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "bin-*", path: out, merge-multiple: true }
      - name: Checksums and Homebrew formula
        run: |
          cd out
          sha256sum countercheck-*.tar.gz countercheck-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ../packaging/homebrew/formula.sh "${{ needs.version.outputs.version }}" SHA256SUMS.txt \
            "https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}" \
            > agent-countercheck.rb
      - name: Install script works against these files
        run: |
          (cd out && python3 -m http.server 18765 --bind 127.0.0.1 &)
          # Wait until the server answers (a fixed sleep raced it on slow runners).
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:18765/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:18765/ || { echo 'the local download server did not start' >&2; exit 1; }
          COUNTERCHECK_VERSION=${{ needs.version.outputs.version }} \
          COUNTERCHECK_BASE_URL=http://127.0.0.1:18765 COUNTERCHECK_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
      - uses: actions/upload-artifact@v4
        with: { name: release-files, path: out/* }

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* install.sh install.ps1 \
            --title "Agent Countercheck ${GITHUB_REF_NAME}" --generate-notes --verify-tag

  pypi:
    # Needs a one-time "trusted publisher" on pypi.org (no token stored here) and the repository
    # variable PUBLISH_PYPI=true. Until then this job is skipped.
    needs: [release]
    if: github.ref_type == 'tag' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "{wheel-*,sdist}", path: dist, merge-multiple: true }
      # The old name, countercheck: an empty package that installs agent-countercheck at this version.
      # PyPI needs this workflow as a trusted publisher on both projects.
      - uses: actions/checkout@v4
        with: { path: src, sparse-checkout: packaging/pypi-legacy }
      - name: Build the countercheck (old name) package
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd src/packaging/pypi-legacy
          sed -i "s/0\.0\.0/$v/g" pyproject.toml
          grep -c "$v" pyproject.toml
          python3 -m pip install --quiet build
          python3 -m build --outdir "$GITHUB_WORKSPACE/dist" .
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

[package]
name = "countercheck"
description = "countercheck CLI: checks whether an AI worker's \"done\" is really done, and writes a receipt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "countercheck"
path = "src/main.rs"

[dependencies]
countercheck-core = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
clap = { workspace = true }
tempfile = { workspace = true }
# The diff `hook install` shows (already in the tree through the core).
similar = { workspace = true }
wait-timeout = { workspace = true }
humantime = { workspace = true }
# Random token and nonces for `countercheck ui` (already in the tree through tempfile).
getrandom = { workspace = true }

# Windows: `link` folders (node_modules, .venv) become directory junctions, which need no admin
# rights or Developer Mode (a safe API over the reparse-point calls; our crates stay unsafe-free).
# Linux: the check sandbox (`countercheck sandbox-exec`). Landlock confines writes without root;
# user, network and PID namespaces give a loopback-only network and kill everything a check started.
# Both crates are safe APIs; our crates stay unsafe-free.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
nix = { version = "0.31", features = ["sched", "process", "signal", "socket", "user", "fs"] }

[target.'cfg(windows)'.dependencies]
junction = "1"
# Windows: each check runs in a Job Object, so a timeout kills every process it started (MSYS
# programs break the parent chain `taskkill /T` follows). Safe API; our crates stay unsafe-free.
win32job = "2"
# Windows: the check sandbox (write-restricted token, permissions). The workspace's only
# `unsafe`, kept in that small crate for review (docs/decisions/0003-windows-sandbox.md).
countercheck-winsandbox = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The diff `hook install` shows (already in the tree through the core).
similar = { workspace = true }
serde_json = { workspace = true }

[package]
name = "countercheck-core"
description = "countercheck core: check files, protected paths, receipts and verdicts (pure, no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# float_roundtrip: a receipt read back must hash the same, or `show` calls it BROKEN.
serde_json = { workspace = true, features = ["float_roundtrip"] }
toml = { workspace = true }
sha2 = { workspace = true }
globset = { workspace = true }
# Linear-time matching: forbid/coverage patterns come from a repository we don't control.
regex = { workspace = true }
# Golden csv comparison.
csv = { workspace = true }

[dev-dependencies]
proptest = "1"
regex = { workspace = true }

# Python packaging for `pip install agent-countercheck` / `uv tool install agent-countercheck` /
# `uvx --from agent-countercheck countercheck`. The package is agent-countercheck; the command it installs is countercheck.
# The wheel carries the compiled Rust binary (maturin "bin" bindings, the way ruff and uv ship);
# there is no Python code. Built per platform by .github/workflows/release.yml.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "agent-countercheck"
description = "Proof that AI agents' work really happened: re-runs your checks in a clean copy the agent can't edit, and writes a sealed receipt."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["ai-agents", "verification", "testing", "ci", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://countercheck.datacrate360.ai"
Source = "https://github.com/datacrate360/agent-countercheck"
Issues = "https://github.com/datacrate360/agent-countercheck/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "apps/countercheck/Cargo.toml"
strip = true
# The workspace LICENSE sits outside the CLI crate; pack it so PKG-INFO's License-File exists.
include = [{ path = "LICENSE", format = "sdist" }]

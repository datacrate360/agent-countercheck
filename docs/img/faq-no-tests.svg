<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What Countercheck says when there are no tests</title>
  <desc>No checks.toml: an error asking you to run countercheck init; agent hooks skip the project. checks.toml not committed in the base: UNVERIFIED, because the worker could have written it. checks.toml with no entries: an error. No check ran: UNVERIFIED. A test command that runs zero tests: depends on its exit code; pytest exits 5, so FAILED; unittest before Python 3.12 exits 0, which looks like a pass. Close that gap with pytest or a budget minimum on the test count.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
  </defs>
  <rect width="960" height="470" rx="16" fill="#FFFFFF"/>
  <text x="40" y="38" font-size="13" fill="#64748B" font-weight="700" letter-spacing="1">NO TESTS? IT NEVER SAYS VERIFIED WITHOUT PROOF</text>
  <rect x="20" y="56" width="920" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="83" font-size="14" fill="#0F172A" font-weight="600">No .countercheck/checks.toml at all</text>
  <rect x="440" y="66" width="112" height="24" rx="12" fill="#64748B"/>
  <text x="496.0" y="82.5" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0.6">ERROR</text>
  <text x="570" y="83" font-size="13" fill="#334155">"run countercheck init" · agent hooks skip the project</text>
  <rect x="20" y="108" width="920" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="135" font-size="14" fill="#0F172A" font-weight="600">checks.toml exists, but not in the base commit</text>
  <rect x="440" y="118" width="112" height="24" rx="12" fill="#B45309"/>
  <text x="496.0" y="134.5" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0.6">UNVERIFIED</text>
  <text x="570" y="135" font-size="13" fill="#334155">the agent could have written it</text>
  <rect x="20" y="160" width="920" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="187" font-size="14" fill="#0F172A" font-weight="600">checks.toml committed, but empty</text>
  <rect x="440" y="170" width="112" height="24" rx="12" fill="#64748B"/>
  <text x="496.0" y="186.5" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0.6">ERROR</text>
  <text x="570" y="187" font-size="13" fill="#334155">"has no [[check]], [[forbid]] or [[coverage]] entries"</text>
  <rect x="20" y="212" width="920" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="239" font-size="14" fill="#0F172A" font-weight="600">Checks listed, but none ran</text>
  <rect x="440" y="222" width="112" height="24" rx="12" fill="#B45309"/>
  <text x="496.0" y="238.5" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0.6">UNVERIFIED</text>
  <text x="570" y="239" font-size="13" fill="#334155">"no checks ran"</text>
  <rect x="20" y="264" width="920" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="291" font-size="14" fill="#0F172A" font-weight="600">pytest, and the project has 0 tests</text>
  <rect x="440" y="274" width="112" height="24" rx="12" fill="#C2410C"/>
  <text x="496.0" y="290.5" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle" letter-spacing="0.6">FAILED</text>
  <text x="570" y="291" font-size="13" fill="#334155">pytest exits 5 when it collects nothing</text>
  <rect x="20" y="324" width="920" height="138" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
  <text x="40" y="350" font-size="13" fill="#B45309" font-weight="700" letter-spacing="1">THE ONE GAP: A COMMAND THAT RUNS NOTHING AND SAYS OK</text>
  <text x="40" y="376" font-size="14" fill="#0F172A">unittest before Python 3.12 prints OK and exits 0 with zero tests, so it looks like a pass.</text>
  <text x="40" y="398" font-size="14" fill="#334155">Countercheck trusts exit codes: it can't tell "0 tests passed" from "all tests passed".</text>
  <text x="40" y="428" font-size="14" fill="#134E4A" font-weight="800">Fix:</text>
  <text x="80" y="428" font-size="14" fill="#334155">use pytest, or require a minimum:</text>
  <text x="300" y="428" font-size="14" fill="#134E4A" font-weight="700" font-family="SFMono-Regular, Menlo, Consolas, monospace">budget = { metric = "tests", min = 40 }</text>
  <text x="80" y="448" font-size="13" fill="#64748B">(the check prints METRIC tests=&lt;count&gt;; fewer than 40 tests = FAILED)</text>
</svg>

  <text x="790" y="432" font-size="11" fill="#64748B" text-anchor="middle">10</text>
  <text x="20" y="38" font-size="15" fill="#0F172A" font-weight="700">False "done" claims: the agent said it succeeded, hidden tests said no (lower is better)</text>

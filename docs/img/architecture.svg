  <text x="718" y="178" font-size="13" font-weight="650" fill="#0F4C4C" text-anchor="start">Sealed receipt</text>
  <text x="718" y="197" font-size="10" font-weight="500" fill="#141414" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.countercheck/receipts/&lt;id&gt;.json</text>
  <text x="718" y="215" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">claim, each check&#x27;s output,</text>
  <text x="718" y="229" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">protected files touched, verdict</text>
  <rect x="704" y="256" width="232" height="86" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.4"/>
  <text x="718" y="278" font-size="13" font-weight="650" fill="#C2410C" text-anchor="start">Back to the agent</text>
  <text x="718" y="297" font-size="10" font-weight="500" fill="#141414" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hook: block or let it stop</text>
  <text x="718" y="315" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">FAILED + “done”: the failing output</text>
  <text x="718" y="329" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">goes back (at most 3 times)</text>
  <rect x="704" y="356" width="232" height="86" rx="10" fill="#FFFFFF" stroke="#E7E5E0" stroke-width="1.4"/>
  <text x="718" y="378" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Exit code</text>
  <text x="718" y="397" font-size="10" font-weight="500" fill="#141414" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0 ok · 2 failed · 3 unverified</text>
  <text x="718" y="415" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">CI fails the job on anything but 0</text>

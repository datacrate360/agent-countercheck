  <text x="38" y="98" font-size="11" font-weight="500" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hook session-start</text>
  <text x="38" y="115" font-size="11" font-weight="500" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hook claude-stop</text>
  <text x="38" y="134" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">set up by hook install</text>
  <rect x="24" y="160" width="206" height="107" rx="10" fill="#FFFFFF" stroke="#E7E5E0" stroke-width="1.2"/>
  <text x="38" y="182" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Cursor · Codex · Copilot</text>
  <text x="38" y="199" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Goose · Kiro</text>
  <text x="38" y="219" font-size="11" font-weight="500" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hook session-start</text>
  <text x="38" y="236" font-size="11" font-weight="500" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hook &lt;agent&gt;-stop</text>
  <text x="38" y="255" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">set up by hook install</text>
  <rect x="24" y="281" width="206" height="73" rx="10" fill="#FFFFFF" stroke="#E7E5E0" stroke-width="1.2"/>
  <text x="38" y="303" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Hermes Agent</text>
  <text x="38" y="323" font-size="11" font-weight="500" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hook hermes-pre-verify</text>
  <text x="38" y="342" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">runs before the agent may finish</text>
  <rect x="24" y="368" width="206" height="73" rx="10" fill="#FFFFFF" stroke="#E7E5E0" stroke-width="1.2"/>
  <text x="38" y="390" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Any agent, a script, you</text>
  <text x="38" y="410" font-size="11" font-weight="500" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">countercheck verify</text>
  <text x="38" y="429" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">agent named from its shell or --agent</text>
  <rect x="24" y="455" width="206" height="73" rx="10" fill="#FFFFFF" stroke="#E7E5E0" stroke-width="1.2"/>
  <text x="38" y="477" font-size="13" font-weight="650" fill="#141414" text-anchor="start">CI · GitHub Action</text>
  <text x="38" y="497" font-size="11" font-weight="500" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verify --base origin/main</text>
  <text x="38" y="516" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">on every pull request</text>
  <rect x="262" y="56" width="404" height="74" rx="10" fill="#F4F3F0" stroke="#E7E5E0" stroke-width="1.2"/>
  <text x="278" y="78" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Your git repository</text>
  <text x="278" y="98" font-size="11" font-weight="500" fill="#6B6B66" text-anchor="start">base commit (before the agent):</text>
  <text x="458" y="98" font-size="11" font-weight="500" fill="#0F4C4C" text-anchor="start">.countercheck/checks.toml · tests</text>
  <text x="278" y="116" font-size="11" font-weight="500" fill="#6B6B66" text-anchor="start">working tree (now):</text>
  <text x="458" y="116" font-size="11" font-weight="500" fill="#141414" text-anchor="start">the agent&#x27;s files, committed or not</text>
  <rect x="262" y="156" width="404" height="456" rx="14" fill="#0F4C4C" stroke="#0F4C4C" stroke-width="0"/>
  <text x="464.0" y="184" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">countercheck verify</text>
  <text x="464.0" y="202" font-size="11" font-weight="400" fill="#CFE3E0" text-anchor="middle">the worker never grades itself</text>
  <rect x="276" y="218" width="376" height="64" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
  <text x="292" y="240" font-size="13" font-weight="700" fill="#0F4C4C" text-anchor="start">1</text>
  <text x="310" y="240" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Lock the checks</text>
  <text x="638" y="240" font-size="10.5" font-weight="500" fill="#6B6B66" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">git.rs · config</text>
  <text x="310" y="258" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">read checks.toml and the protected list from the base</text>
  <text x="310" y="273" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">commit</text>
  <rect x="276" y="290" width="376" height="64" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
  <text x="292" y="312" font-size="13" font-weight="700" fill="#0F4C4C" text-anchor="start">2</text>
  <text x="310" y="312" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Clean copy</text>
  <text x="638" y="312" font-size="10.5" font-weight="500" fill="#6B6B66" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">snapshot.rs · protect</text>
  <text x="310" y="330" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">copy the working tree to a new folder; put back every</text>
  <text x="310" y="345" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">protected file from base (Git LFS too)</text>
  <rect x="276" y="362" width="376" height="92" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
  <text x="292" y="384" font-size="13" font-weight="700" fill="#0F4C4C" text-anchor="start">3</text>
  <text x="310" y="384" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Run each check in a sandbox</text>
  <text x="638" y="384" font-size="10.5" font-weight="500" fill="#6B6B66" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">runner.rs</text>
  <text x="310" y="402" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">macOS Seatbelt · Linux Landlock + namespaces · Windows</text>
  <text x="310" y="417" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">restricted token + job</text>

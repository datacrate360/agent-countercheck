  <text x="718" y="478" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Read the receipts</text>
  <text x="718" y="500" font-size="11" font-weight="600" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">show</text>
  <text x="770" y="500" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">one receipt + seal check</text>
  <text x="718" y="518" font-size="11" font-weight="600" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">report</text>
  <text x="770" y="518" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">offline HTML, no scripts</text>
  <text x="718" y="536" font-size="11" font-weight="600" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ui</text>
  <text x="770" y="536" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">live page on 127.0.0.1</text>
  <text x="718" y="554" font-size="11" font-weight="600" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prune</text>
  <text x="770" y="554" font-size="10.5" font-weight="400" fill="#6B6B66" text-anchor="start">delete old ones, on request</text>
  <path d="M702 323.0 H685 V652 H127.0 V534" fill="none" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ac)"/>
  <text x="464.0" y="645" font-size="11" font-weight="600" fill="#C2410C" text-anchor="middle">the agent fixes the code (not the tests) and says “done” again</text>
  <line x1="24" y1="670" x2="936" y2="670" stroke="#E7E5E0"/>
  <text x="24" y="686" font-size="11" font-weight="700" fill="#6B6B66" text-anchor="start" letter-spacing="1">IN THE CODE</text>
  <text x="24" y="708" font-size="11" font-weight="600" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">crates/countercheck-core</text>
  <text x="250" y="708" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">pure logic, no I/O: config, protect, receipt, claim, report, progress, the six check types</text>
  <text x="24" y="726" font-size="11" font-weight="600" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">crates/countercheck-winsandbox</text>
  <text x="250" y="726" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">the Windows sandbox&#x27;s Win32 calls; the only crate allowed unsafe</text>
  <text x="24" y="744" font-size="11" font-weight="600" fill="#0F4C4C" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">apps/countercheck</text>
  <text x="250" y="744" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">the binary: git, snapshot, runner, Linux/Windows sandboxes, hooks, report, ui, prune</text>

  <text x="638" y="484" font-size="10.5" font-weight="500" fill="#6B6B66" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">receipt · claim</text>
  <text x="310" y="502" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">VERIFIED only if every locked check ran and passed; does</text>
  <text x="310" y="517" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">the claim match?</text>
  <rect x="276" y="534" width="376" height="64" rx="9" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
  <text x="292" y="556" font-size="13" font-weight="700" fill="#0F4C4C" text-anchor="start">5</text>
  <text x="310" y="556" font-size="13" font-weight="650" fill="#141414" text-anchor="start">Seal</text>
  <text x="638" y="556" font-size="10.5" font-weight="500" fill="#6B6B66" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">receipt</text>
  <text x="310" y="574" font-size="11" font-weight="400" fill="#3A3A36" text-anchor="start">SHA-256 over the whole receipt; any later edit shows</text>

  <text x="540.2" y="439" font-size="10" font-weight="600" fill="#0F4C4C" text-anchor="middle">budget</text>
  <rect x="567.9" y="426" width="57.2" height="18" rx="9" fill="#E6F0EE" stroke="#E6F0EE" stroke-width="0"/>
  <text x="596.5" y="439" font-size="10" font-weight="600" fill="#0F4C4C" text-anchor="middle">coverage</text>

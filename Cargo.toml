[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/datacrate360/agent-countercheck"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
countercheck-core = { path = "crates/countercheck-core" }
countercheck-winsandbox = { path = "crates/countercheck-winsandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
wait-timeout = "0.2"
humantime = "2"
regex = "1"
csv = "1"
similar = { version = "2", default-features = false }
getrandom = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
